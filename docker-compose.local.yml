version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gifts-workshop-postgres
    restart: always
    environment:
      POSTGRES_DB: gifts_workshop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_local_password
    ports:
      - "5432:5432"
    volumes:
      - ./.docker/db-data:/var/lib/postgresql/data
    networks:
      - gifts-workshop-network

  # Serves the media folder the app writes to. Read-only: only the app writes there.
  caddy:
    image: caddy:2-alpine
    container_name: gifts-workshop-caddy
    restart: always
    command: caddy run --config /etc/caddy/Caddyfile
    ports:
      - "8080:80"
    volumes:
      - ./caddy/Caddyfile.local:/etc/caddy/Caddyfile:ro
      - ./.docker/media:/srv/media:ro
    networks:
      - gifts-workshop-network

  pgweb:
    image: sosedoff/pgweb:latest
    container_name: gifts-workshop-pgweb
    restart: always
    environment:
      - DATABASE_URL=postgres://postgres:postgres_local_password@postgres:5432/gifts_workshop?sslmode=disable
    ports:
      - "8081:8081"
    depends_on:
      - postgres
    networks:
      - gifts-workshop-network

networks:
  gifts-workshop-network:
    ipam:
      driver: default
      config:
        - subnet: 10.10.10.0/24
