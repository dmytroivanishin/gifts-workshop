version: '3.8'
services:
  # No volume on purpose, same as test-minio below: fully ephemeral, gone on every `down` (no -v
  # needed). A named volume here used to survive `down` and once accumulated an incompatible
  # schema across runs (a stale-volume bug, had to be cleared by hand with `down -v`) — dropped
  # it so test:db:start always starts from a truly blank Postgres and `drizzle-kit push` recreates
  # the schema fresh every time. Self-cleaning within a run is unrelated and unaffected: that's
  # the tests' own fixtures deleting what they created through the real API.
  test-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_gift_workshop
    ports:
      - "5433:5432" # Use 5433 to avoid conflict with dev DB if running
    networks:
      - test-network

  # Isolated from the dev MinIO (docker-compose.yml, ports 9000/9001) so API tests never depend
  # on the dev stack being up and never write test clutter into the real dev bucket.
  test-minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: server /data --console-address ":9003"
    environment:
      MINIO_ROOT_USER: test_minio_admin
      MINIO_ROOT_PASSWORD: test_minio_password
    ports:
      - "9002:9000"
      - "9003:9003"
    networks:
      - test-network

networks:
  test-network:
    ipam:
      config:
        - subnet: 172.30.0.0/16
