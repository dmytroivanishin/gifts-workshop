version: '3.8'
services:
  # No volume on purpose: fully ephemeral, gone on every `down` (no -v needed). A named volume here
  # once accumulated an incompatible schema across runs, so test:infra:start always starts from a
  # truly blank Postgres and `drizzle-kit push` recreates the schema fresh every time. Self-cleaning
  # within a run is unrelated and unaffected: that's the tests' own fixtures deleting what they
  # created through the real API.
  test-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_gifts_workshop
    ports:
      - "5433:5432" # Use 5433 to avoid conflict with dev DB if running
    networks:
      - test-network

  # Serves the test media folder (.docker/media/gifts-workshop-media-test) on 8082. Same Caddyfile as
  # dev; the bucket is only a folder name, so test files never mix with the dev media.
  test-caddy:
    image: caddy:2-alpine
    command: caddy run --config /etc/caddy/Caddyfile
    ports:
      - "8082:80"
    volumes:
      - ./caddy/Caddyfile.local:/etc/caddy/Caddyfile:ro
      - ./.docker/media:/srv/media:ro
    networks:
      - test-network

networks:
  test-network:
    ipam:
      config:
        - subnet: 172.30.0.0/16
