# Manual run only: build two images, push them to GHCR, then deploy to the VPS over SSH.
#
# Secrets (Settings > Secrets and variables > Actions > Secrets):
#   VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_KNOWN_HOSTS  (known_hosts line from ssh-keyscan, pinned)
#   POSTGRES_USER, POSTGRES_PASSWORD        (hex only: they are put into DB_URI unescaped)
#   JWT_SECRET
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET  (optional: the Google sign-in icon shows only when both are set)
#   YANDEX_CLIENT_ID, YANDEX_CLIENT_SECRET  (optional: the Yandex sign-in icon shows only when both are set)
# Variables (Settings > Secrets and variables > Actions > Variables):
#   POSTGRES_DB, S3_BUCKET_NAME, ADMIN_EMAILS, MEDIA_THUMBNAIL_MAX_PX, MEDIA_PREVIEW_MAX_PX
#   NEXT_PUBLIC_APP_URL, NEXT_PUBLIC_SUPPORTED_LOCALES, NEXT_PUBLIC_DEFAULT_LOCALE,
#   NEXT_PUBLIC_DEFAULT_LOCALE_PUBLIC, NEXT_PUBLIC_MAX_FILE_SIZE_MB, NEXT_PUBLIC_MAX_FILES_PER_UPLOAD,
#   NEXT_PUBLIC_SOCIAL_LINKS, SITE_* (10 texts)
# Derived here, not configured: DB_URI, S3_PUBLIC_URL (= NEXT_PUBLIC_APP_URL + /static/media),
# NEXT_PUBLIC_DEV_MODE (always false).
# Media files live in /opt/gifts-workshop/media on the VPS (created by this workflow, owned by uid 1000).

name: Release and deploy

on:
  # Manual only: a tag push does not deploy. Run it from Actions, choosing the ref and wipe.
  workflow_dispatch:
    inputs:
      wipe:
        description: "play = wipe the VPS first (containers, database, media), then deploy. Caddy certificates are kept. skip = deploy only."
        type: choice
        options:
          - skip
          - play
        default: skip

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Only on a manual run with wipe = play. Everything on the VPS is removed; the build and deploy below run after it.
  wipe:
    if: github.event_name == 'workflow_dispatch' && inputs.wipe == 'play'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Wipe the VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/deploy_key" && chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh_opts=(-i "$HOME/.ssh/deploy_key" -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o StrictHostKeyChecking=yes)
          {
            cat <<'REMOTE'
            set -euo pipefail
            cd /opt/gifts-workshop 2>/dev/null || { echo "Nothing deployed yet, nothing to wipe."; exit 0; }

            # Containers and networks go. Only the Postgres volume is removed explicitly. The Caddy volumes
            # (certificates and config) stay: deleting them makes Caddy request new certificates from Let's
            # Encrypt on every wipe, which runs into its rate limits.
            docker compose -p gifts-workshop --env-file config/.env -f docker-compose.yml down --remove-orphans
            docker volume rm gifts-workshop_postgres-data 2>/dev/null || true

            # Uploads are owned by uid 1000 (the app user), so they are removed from a container, not as the SSH user.
            if [ -d media ]; then
              docker run --rm -v "$PWD/media:/media" alpine sh -c 'rm -rf /media/* /media/.[!.]* /media/..?* 2>/dev/null; true'
            fi

            # Forget the last deployed tag, so a failed deploy after the wipe cannot roll back to a database that no longer exists.
            rm -f .deployed_tag
            echo "VPS wiped."
          REMOTE
          } | ssh "${ssh_opts[@]}" "${VPS_USER}@${VPS_HOST}" bash -s

  build:
    needs: wipe
    # Runs after the wipe, and also when the wipe was skipped. Only a failed or cancelled wipe stops the deploy.
    if: ${{ always() && (needs.wipe.result == 'success' || needs.wipe.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.names.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Image names (GHCR needs lowercase)
        id: names
        run: |
          image=$(echo "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      # The social links are JSON with commas and quotes, which docker/build-push-action mangles when
      # they are passed as build-args. base64 has neither, so the Dockerfile decodes it before the build.
      - name: Encode social links for the build
        id: social
        env:
          SOCIAL_LINKS: ${{ vars.NEXT_PUBLIC_SOCIAL_LINKS }}
        run: echo "b64=$(printf '%s' "$SOCIAL_LINKS" | base64 -w0)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: ${{ steps.names.outputs.image }}:${{ github.ref_name }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_SUPPORTED_LOCALES=${{ vars.NEXT_PUBLIC_SUPPORTED_LOCALES }}
            NEXT_PUBLIC_DEFAULT_LOCALE=${{ vars.NEXT_PUBLIC_DEFAULT_LOCALE }}
            NEXT_PUBLIC_DEFAULT_LOCALE_PUBLIC=${{ vars.NEXT_PUBLIC_DEFAULT_LOCALE_PUBLIC }}
            NEXT_PUBLIC_MAX_FILE_SIZE_MB=${{ vars.NEXT_PUBLIC_MAX_FILE_SIZE_MB }}
            NEXT_PUBLIC_MAX_FILES_PER_UPLOAD=${{ vars.NEXT_PUBLIC_MAX_FILES_PER_UPLOAD }}
            NEXT_PUBLIC_DEV_MODE=false
            NEXT_PUBLIC_SOCIAL_LINKS_B64=${{ steps.social.outputs.b64 }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build and push the migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: ${{ steps.names.outputs.image }}-migrator:${{ github.ref_name }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_SUPPORTED_LOCALES=${{ vars.NEXT_PUBLIC_SUPPORTED_LOCALES }}
            NEXT_PUBLIC_DEFAULT_LOCALE=${{ vars.NEXT_PUBLIC_DEFAULT_LOCALE }}
            NEXT_PUBLIC_DEFAULT_LOCALE_PUBLIC=${{ vars.NEXT_PUBLIC_DEFAULT_LOCALE_PUBLIC }}
            NEXT_PUBLIC_MAX_FILE_SIZE_MB=${{ vars.NEXT_PUBLIC_MAX_FILE_SIZE_MB }}
            NEXT_PUBLIC_MAX_FILES_PER_UPLOAD=${{ vars.NEXT_PUBLIC_MAX_FILES_PER_UPLOAD }}
            NEXT_PUBLIC_DEV_MODE=false
            NEXT_PUBLIC_SOCIAL_LINKS_B64=${{ steps.social.outputs.b64 }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

  deploy:
    needs: build
    # Explicit: a skipped wipe (wipe = skip) also skips build's dependants unless always() is set.
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Write config/.env from secrets and variables
        shell: bash
        env:
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YANDEX_CLIENT_ID: ${{ secrets.YANDEX_CLIENT_ID }}
          YANDEX_CLIENT_SECRET: ${{ secrets.YANDEX_CLIENT_SECRET }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MEDIA_THUMBNAIL_MAX_PX: ${{ vars.MEDIA_THUMBNAIL_MAX_PX }}
          MEDIA_PREVIEW_MAX_PX: ${{ vars.MEDIA_PREVIEW_MAX_PX }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_SUPPORTED_LOCALES: ${{ vars.NEXT_PUBLIC_SUPPORTED_LOCALES }}
          NEXT_PUBLIC_DEFAULT_LOCALE: ${{ vars.NEXT_PUBLIC_DEFAULT_LOCALE }}
          NEXT_PUBLIC_DEFAULT_LOCALE_PUBLIC: ${{ vars.NEXT_PUBLIC_DEFAULT_LOCALE_PUBLIC }}
          NEXT_PUBLIC_MAX_FILE_SIZE_MB: ${{ vars.NEXT_PUBLIC_MAX_FILE_SIZE_MB }}
          NEXT_PUBLIC_MAX_FILES_PER_UPLOAD: ${{ vars.NEXT_PUBLIC_MAX_FILES_PER_UPLOAD }}
          NEXT_PUBLIC_SOCIAL_LINKS: ${{ vars.NEXT_PUBLIC_SOCIAL_LINKS }}
          SITE_TITLE_RU: ${{ vars.SITE_TITLE_RU }}
          SITE_TITLE_EN: ${{ vars.SITE_TITLE_EN }}
          SITE_TEMPLATE_RU: ${{ vars.SITE_TEMPLATE_RU }}
          SITE_TEMPLATE_EN: ${{ vars.SITE_TEMPLATE_EN }}
          SITE_DESCRIPTION_RU: ${{ vars.SITE_DESCRIPTION_RU }}
          SITE_DESCRIPTION_EN: ${{ vars.SITE_DESCRIPTION_EN }}
          SITE_KEYWORDS_RU: ${{ vars.SITE_KEYWORDS_RU }}
          SITE_KEYWORDS_EN: ${{ vars.SITE_KEYWORDS_EN }}
          SITE_NAME_RU: ${{ vars.SITE_NAME_RU }}
          SITE_NAME_EN: ${{ vars.SITE_NAME_EN }}
        run: |
          umask 077

          # Derived values: one source each, so nothing can drift from the rest.
          export DB_URI="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
          export S3_PUBLIC_URL="${NEXT_PUBLIC_APP_URL}/static/media"
          export NEXT_PUBLIC_DEV_MODE="false"
          # Caddy needs one contact address for ZeroSSL. It is the first entry of ADMIN_EMAILS.
          export ACME_EMAIL="${ADMIN_EMAILS%%,*}"

          # printf, not echo: values may contain spaces, quotes or backslashes.
          put() { printf '%s=%s\n' "$1" "${!1}"; }
          {
            echo "# Written by the deploy workflow. Do not edit on the server."
            put NEXT_PUBLIC_APP_URL
            put NEXT_PUBLIC_SUPPORTED_LOCALES
            put NEXT_PUBLIC_DEFAULT_LOCALE
            put NEXT_PUBLIC_DEFAULT_LOCALE_PUBLIC
            put NEXT_PUBLIC_MAX_FILE_SIZE_MB
            put NEXT_PUBLIC_MAX_FILES_PER_UPLOAD
            put NEXT_PUBLIC_DEV_MODE
            put NEXT_PUBLIC_SOCIAL_LINKS
            put MEDIA_THUMBNAIL_MAX_PX
            put MEDIA_PREVIEW_MAX_PX
            put DB_URI
            put S3_PUBLIC_URL
            put S3_BUCKET_NAME
            put GOOGLE_CLIENT_ID
            put GOOGLE_CLIENT_SECRET
            put YANDEX_CLIENT_ID
            put YANDEX_CLIENT_SECRET
            put ADMIN_EMAILS
            put ACME_EMAIL
            put JWT_SECRET
            put SITE_TITLE_RU
            put SITE_TITLE_EN
            put SITE_TEMPLATE_RU
            put SITE_TEMPLATE_EN
            put SITE_DESCRIPTION_RU
            put SITE_DESCRIPTION_EN
            put SITE_KEYWORDS_RU
            put SITE_KEYWORDS_EN
            put SITE_NAME_RU
            put SITE_NAME_EN
            echo "# Compose-only: Postgres container"
            put POSTGRES_DB
            put POSTGRES_USER
            put POSTGRES_PASSWORD
          } > "$RUNNER_TEMP/gifts-workshop.env"

      - name: Copy stack files to the VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/deploy_key" && chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

          ssh_opts=(-i "$HOME/.ssh/deploy_key" -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o StrictHostKeyChecking=yes)
          remote="${VPS_USER}@${VPS_HOST}"

          ssh "${ssh_opts[@]}" "$remote" "mkdir -p /opt/gifts-workshop/config /opt/gifts-workshop/caddy && chmod 700 /opt/gifts-workshop/config"
          scp "${ssh_opts[@]}" docker-compose.yml "$remote:/opt/gifts-workshop/docker-compose.yml"
          scp "${ssh_opts[@]}" caddy/Caddyfile "$remote:/opt/gifts-workshop/caddy/Caddyfile"
          scp "${ssh_opts[@]}" "$RUNNER_TEMP/gifts-workshop.env" "$remote:/opt/gifts-workshop/config/.env"
          ssh "${ssh_opts[@]}" "$remote" "chmod 600 /opt/gifts-workshop/config/.env"

      - name: Run the deploy on the VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          IMAGE_REPO: ${{ needs.build.outputs.image }}
          IMAGE_TAG: ${{ github.ref_name }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh_opts=(-i "$HOME/.ssh/deploy_key" -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o StrictHostKeyChecking=yes)
          # The script and its variables travel over stdin: the token never appears on the command line or in the logs.
          {
            printf 'export IMAGE_REPO=%q\n' "$IMAGE_REPO"
            printf 'export IMAGE_TAG=%q\n' "$IMAGE_TAG"
            printf 'export GHCR_USER=%q\n' "$GITHUB_ACTOR"
            printf 'export GHCR_TOKEN=%q\n' "$GHCR_TOKEN"
            cat <<'REMOTE'
            set -euo pipefail
            # Name the failing line: a silent stop is otherwise indistinguishable from success until the final check.
            trap 'echo "Deploy failed at line $LINENO" >&2' ERR

            cd /opt/gifts-workshop
            compose=(docker compose -p gifts-workshop --env-file config/.env -f docker-compose.yml)
            previous_tag=$(cat .deployed_tag 2>/dev/null || true)

            # Media folder, created here and not by Docker: a bind mount that does not exist yet is
            # created root-owned, and the app (uid 1000, the image's node user) could not write to it.
            # uid 1000 is the `node` user in node:*-bookworm-slim, the base of the image.
            # chown to another uid needs root, and the SSH user is not root: the change is made from a container.
            mkdir -p media
            docker run --rm -v "$PWD/media:/media" alpine sh -c 'chown 1000:1000 /media && chmod 755 /media'

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

            echo "Pulling ${IMAGE_TAG}"
            "${compose[@]}" pull app migrate

            echo "Starting Postgres"
            "${compose[@]}" up -d postgres

            echo "Running migrations"
            # -T and </dev/null: without them `run` reads stdin, which is this script, and silently ends it.
            if ! "${compose[@]}" run -T --rm migrate </dev/null; then
              echo "Migration failed. The previous version keeps running; nothing was switched." >&2
              exit 1
            fi

            # --remove-orphans also clears containers left by the previous release.
            echo "Starting app and Caddy"
            "${compose[@]}" up -d --remove-orphans app caddy

            # The Caddyfile is a bind mount: editing it does not recreate the container, so reload it.
            # </dev/null: compose exec keeps stdin open even with -T, and stdin is this script.
            "${compose[@]}" exec -T caddy caddy reload --config /etc/caddy/Caddyfile </dev/null

            # The image's HEALTHCHECK polls /api/health. Wait for it instead of assuming the start worked.
            container_id=$("${compose[@]}" ps -q app)
            healthy=0
            for _ in $(seq 1 40); do
              status=$(docker inspect -f '{{.State.Health.Status}}' "$container_id" 2>/dev/null || echo starting)
              if [ "$status" = "healthy" ]; then
                healthy=1
                break
              fi
              sleep 3
            done

            if [ "$healthy" -ne 1 ]; then
              echo "App is not healthy after the deploy." >&2
              # Why it failed, printed into this job's log: the container state and the last lines of its output.
              echo "--- container health ---" >&2
              docker inspect -f '{{json .State}}' "$container_id" >&2 || true
              echo "--- app logs (last 150 lines) ---" >&2
              "${compose[@]}" logs --no-color --tail 150 app </dev/null >&2 || true
              echo "--- end of app logs ---" >&2
              if [ -n "$previous_tag" ]; then
                echo "Rolling the app back to ${previous_tag}" >&2
                IMAGE_TAG="$previous_tag" "${compose[@]}" up -d app
              fi
              exit 1
            fi

            # Uploads must work: write and remove a probe file as the app's user, from inside the container.
            if ! "${compose[@]}" exec -T app sh -c 'probe=".docker/media/.deploy-probe-$$"; touch "$probe" && rm "$probe"' </dev/null; then
              echo "The app cannot write to the media folder. Check the ownership of /opt/gifts-workshop/media." >&2
              exit 1
            fi

            echo "$IMAGE_TAG" > .deployed_tag
            docker image prune -f >/dev/null
            echo "Deployed ${IMAGE_TAG}"
          REMOTE
          } | ssh "${ssh_opts[@]}" "${VPS_USER}@${VPS_HOST}" bash -s | tee "$RUNNER_TEMP/remote.log"

          # A green step must mean the remote script reached its last line, not just that it stopped quietly.
          grep -q '^Deployed ' "$RUNNER_TEMP/remote.log" || { echo "The remote deploy did not finish." >&2; exit 1; }
