# Production stack for one server (no Coolify). Images are built and pushed by GitHub Actions
# (target `runner` and target `migrator` of the Dockerfile) and only pulled here: the server has
# no source code and never builds anything.
#
# Required in the environment of the deploy command (not in config/.env):
#   IMAGE_REPO   e.g. ghcr.io/<owner>/<repo>   (the migrator image is <IMAGE_REPO>-migrator)
#   IMAGE_TAG    the git tag being deployed, e.g. 1.0.0
#
# Deploy order, as run by the GitHub Actions job over SSH (see the deploy script):
#   docker compose -p gifts-workshop --env-file config/.env -f docker-compose.yml pull
#   docker compose -p gifts-workshop --env-file config/.env -f docker-compose.yml up -d postgres
#   docker compose -p gifts-workshop --env-file config/.env -f docker-compose.yml run --rm migrate
#   docker compose -p gifts-workshop --env-file config/.env -f docker-compose.yml up -d --remove-orphans app caddy
#
# Media: the app writes uploaded files to ./media on the host (bind mount), Caddy serves the same
# folder read-only under /static/media. The folder must exist and be owned by uid 1000 (the `node`
# user in the image) before the first start; the deploy script creates it. Do not let Docker create
# it: that makes it root-owned and every upload fails.
#
# config/.env holds runtime values and secrets. Public NEXT_PUBLIC_* values are already baked into
# the image at build time; keep them identical in config/.env because the server reads them too.
# Caddy takes the site host from NEXT_PUBLIC_APP_URL in config/.env (https URL, no trailing slash).
# Only Caddy publishes ports (80 and 443). Postgres and the app are reachable only inside the
# compose network.

# Container stdout is kept on disk in rotated files: at most 5 files of 10 MB per service (about 50 MB,
# the most recent entries). Older entries are deleted. Logs do not use RAM.
# Memory limits: mem_limit with memswap_limit equal to it, so a container never uses swap on the host.
# A container that exceeds its limit is killed alone (restart: unless-stopped brings it back), the
# rest of the stack and the host are not affected. Limits are sized for the 2 GB VPS; check them
# with `docker stats` under load and adjust here, not on the server (the deploy copies this file).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    logging: *default-logging
    environment:
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy:/etc/caddy:ro
      - ./media:/srv/media:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 384m
    memswap_limit: 384m
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-off job, started by the deploy script before `app` is updated. A failed migration exits
  # non-zero, the script stops, and the old app keeps running.
  migrate:
    image: ${IMAGE_REPO}-migrator:${IMAGE_TAG}
    env_file: config/.env
    mem_limit: 256m
    memswap_limit: 256m
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]

  app:
    image: ${IMAGE_REPO}:${IMAGE_TAG}
    restart: unless-stopped
    env_file: config/.env
    mem_limit: 768m
    memswap_limit: 768m
    logging: *default-logging
    # Node heap capped below the container limit, so V8 gives up before the kernel kills the container.
    # sharp buffers live outside the heap, which is why the container limit itself is needed.
    environment:
      NODE_OPTIONS: --max-old-space-size=512
    volumes:
      # Mounted where the app looks for media: <cwd>/.docker/media (cwd is /app in the image).
      - ./media:/app/.docker/media
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
