version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gifts-workshop-postgres
    restart: always
    environment:
      POSTGRES_DB: gifts_workshop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_local_password
    ports:
      - "5432:5432"
    volumes:
      - ./.docker/db-data:/var/lib/postgresql/data
    networks:
      - gifts-workshop-network

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: gifts-workshop-minio

    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_admin_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./.docker/minio-data:/data
    networks:
      - gifts-workshop-network

  pgweb:
    image: sosedoff/pgweb:latest
    container_name: gifts-workshop-pgweb
    restart: always
    environment:
      - DATABASE_URL=postgres://postgres:postgres_local_password@postgres:5432/gifts_workshop?sslmode=disable
    ports:
      - "8081:8081"
    depends_on:
      - postgres
    networks:
      - gifts-workshop-network

networks:
  gifts-workshop-network:
    ipam:
      driver: default
      config:
        - subnet: 10.10.10.0/24

