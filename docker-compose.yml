# Production stack for one server (no Coolify). Images are built and pushed by GitHub Actions
# (target `runner` and target `migrator` of the Dockerfile) and only pulled here: the server has
# no source code and never builds anything.
#
# Required in the environment of the deploy command (not in config/.env):
#   IMAGE_REPO   e.g. ghcr.io/<owner>/<repo>   (the migrator image is <IMAGE_REPO>-migrator)
#   IMAGE_TAG    the git tag being deployed, e.g. 1.4.2
#
# Deploy order, as run by the GitHub Actions job over SSH (see the deploy script):
#   docker compose -p gift-workshop --env-file config/.env -f docker-compose.yml pull
#   docker compose -p gift-workshop --env-file config/.env -f docker-compose.yml up -d postgres minio
#   docker compose -p gift-workshop --env-file config/.env -f docker-compose.yml run --rm migrate
#   docker compose -p gift-workshop --env-file config/.env -f docker-compose.yml up -d app caddy
#
# config/.env holds runtime values and secrets. Public NEXT_PUBLIC_* values are already baked into
# the image at build time; keep them identical in config/.env because the server reads them too.
# Caddy takes the site host from NEXT_PUBLIC_APP_URL in config/.env (https URL, no trailing slash).
# Only Caddy publishes ports (80 and 443). Postgres, MinIO and the app are reachable only inside
# the compose network.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
      - minio

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data

  # One-off job, started by the deploy script before `app` is updated. A failed migration exits
  # non-zero, the script stops, and the old app keeps running.
  migrate:
    image: ${IMAGE_REPO}-migrator:${IMAGE_TAG}
    env_file: config/.env
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]

  app:
    image: ${IMAGE_REPO}:${IMAGE_TAG}
    restart: unless-stopped
    env_file: config/.env
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

volumes:
  postgres-data:
  minio-data:
  caddy-data:
  caddy-config:
