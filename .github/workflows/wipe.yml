# Destroys the production data on the VPS: containers, the Postgres volume and every uploaded media file.
# Separate from the deploy workflow on purpose, and it never runs as part of a deploy.
# Caddy certificates are kept: deleting them makes Caddy request new ones from Let's Encrypt on every wipe.
#
# Run it only on purpose: Actions > Wipe production > Run workflow, and type WIPE in the confirmation field.
name: Wipe production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type WIPE to confirm. This deletes the production database and all media."
        type: string
        required: true

# Same group as the deploy: a wipe and a deploy can never run at the same time.
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  wipe:
    if: ${{ inputs.confirm == 'WIPE' }}
    runs-on: ubuntu-latest
    steps:
      - name: Wipe the VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/deploy_key" && chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh_opts=(-i "$HOME/.ssh/deploy_key" -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o StrictHostKeyChecking=yes)
          {
            cat <<'REMOTE'
            set -euo pipefail
            cd /opt/gifts-workshop 2>/dev/null || { echo "Nothing deployed yet, nothing to wipe."; exit 0; }

            # Containers and networks go. Only the Postgres volume is removed explicitly.
            docker compose -p gifts-workshop --env-file config/.env -f docker-compose.yml down --remove-orphans
            docker volume rm gifts-workshop_postgres-data 2>/dev/null || true

            # Uploads are owned by uid 1000 (the app user), so they are removed from a container, not as the SSH user.
            if [ -d media ]; then
              docker run --rm -v "$PWD/media:/media" alpine sh -c 'rm -rf /media/* /media/.[!.]* /media/..?* 2>/dev/null; true'
            fi

            # Forget the last deployed tag, so a later deploy cannot roll back to a database that no longer exists.
            rm -f .deployed_tag
            echo "VPS wiped."
          REMOTE
          } | ssh "${ssh_opts[@]}" "${VPS_USER}@${VPS_HOST}" bash -s
